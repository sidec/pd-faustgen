name: github ci
on:
  push:
    branches: [ faustgen2, testing ]
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Run only the windows-build job (skip macos/ubuntu/tarball)'
        type: boolean
        default: false

jobs:
  macos-build:
    if: ${{ !inputs.windows_only }}

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: dependencies
      run: |
        brew install llvm

    - name: make
      run: |
        echo version: $version
        export PATH="$(brew --prefix)/opt/llvm/bin:$PATH"
        # Apple clang doesn't search Homebrew's lib dirs for -l flags; LLVM's
        # system libs (zstd etc.) live there.
        export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix)/opt/zstd/lib:$(brew --prefix)/opt/ncurses/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
        LLVM_DIR="$(brew --prefix)/opt/llvm/lib/cmake/llvm"
        mkdir build && cd build
        cmake .. -DLLVM_DIR="$LLVM_DIR" -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF
        cmake --build . --config Release --target faustgen_tilde_project
        # staged install into dist
        cmake --install . --prefix dist
        # copy over the Homebrew LLVM dylibs and fix the loader paths of the
        # external so that it doesn't depend on Homebrew at runtime
        cd dist/faustgen2~
        for x in $(otool -L faustgen2~.pd_darwin | sed 's/^ *//' | awk 'NR>1 {print $1}'); do
          case "$x" in
            /usr/*|/System/*|@*|*faustgen2~.pd_darwin) continue ;;
          esac
          echo "bundling: $x"
          cp -f "$x" .
          install_name_tool -change "$x" "@loader_path/$(basename "$x")" faustgen2~.pd_darwin
        done
        # the bundled dylibs themselves reference absolute Homebrew paths
        # (libLLVM -> zstd etc.); rewrite those too so the bundle is relocatable
        for d in *.dylib; do
          for x in $(otool -L "$d" | sed 's/^ *//' | awk 'NR>1 {print $1}'); do
            case "$x" in
              /usr/*|/System/*|@*) continue ;;
            esac
            b="$(basename "$x")"
            [ "$b" = "$d" ] && continue
            echo "bundling (via $d): $x"
            [ -f "$b" ] || cp -f "$x" .
            install_name_tool -change "$x" "@loader_path/$b" "$d"
          done
        done
        # install_name_tool invalidates the arm64 code signature
        codesign -f -s - *.dylib faustgen2~.pd_darwin
        echo "=== lipo -archs ==="
        lipo -archs faustgen2~.pd_darwin
        echo "=== otool -L faustgen2~.pd_darwin ==="
        otool -L faustgen2~.pd_darwin
        cd ../..
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-macos-arm64
        path: build/dist
        retention-days: 7

  ubuntu-build:
    if: ${{ !inputs.windows_only }}

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libedit-dev zlib1g-dev libzstd-dev
        sudo apt-get install -y llvm-dev libpolly-18-dev || sudo apt-get install -y llvm-18-dev libpolly-18-dev

    - name: locate llvm
      run: |
        set -e
        LC="$(command -v llvm-config || true)"
        if [ -z "$LC" ]; then
          LC="$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1 || true)"
        fi
        if [ -z "$LC" ]; then
          echo "llvm-config not found" >&2; exit 1
        fi
        # faust's build looks for an unversioned llvm-config on PATH
        case "$LC" in
          */llvm-config) ;;
          *) sudo ln -sf "$LC" /usr/local/bin/llvm-config ;;
        esac
        echo "LLVM_DIR=$($LC --cmakedir)" >> $GITHUB_ENV

    - name: make
      run: |
        echo version: $version
        mkdir build && cd build
        cmake .. -DLLVM_DIR="$LLVM_DIR" -DCMAKE_BUILD_TYPE=Release -DINSTALL_DIR=faustgen2~ -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF
        cmake --build . --config Release --target faustgen_tilde_project
        # staged install into dist
        cmake --install . --prefix dist
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-ubuntu-x86_64
        path: build/dist
        retention-days: 7

  windows-build:

    runs-on: windows-2025
    # We use bash for the entire build since powershell just drives me insane.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    # Assert that the runner's LLVM is actually usable for our build: we need
    # both llvm-config and LLVMConfig.cmake. The image's install is
    # tools-only, so fall back to installing LLVM via the image's package
    # manager (choco) and check again.

    - name: prepare
      run: |
        set -e
        export PATH="/c/Program Files/LLVM/bin:$PATH"
        llvm_diag() {
          echo "which     : $(command -v llvm-config || echo MISSING)"
          if command -v llvm-config >/dev/null 2>&1; then
            echo "version   : $(llvm-config --version 2>&1 || echo FAIL)"
            d="$(llvm-config --cmakedir 2>&1 || true)"
            echo "cmakedir  : $d"
            [ -n "$d" ] && ls "$(cygpath -u "$d")" 2>&1 | head -5 || true
          fi
          ls "/c/Program Files/LLVM/bin/"llvm-config* 2>&1 || true
          find "/c/Program Files/LLVM" -name "LLVMConfig.cmake" -print 2>/dev/null | head -3 || true
        }
        assert_llvm() {
          command -v llvm-config >/dev/null 2>&1 &&
            llvm-config --version >/dev/null 2>&1 &&
            [ -f "$(cygpath -u "$(llvm-config --cmakedir)")/LLVMConfig.cmake" ]
        }
        llvm_diag
        if ! assert_llvm; then
          echo "== choco install script =="
          cat /c/ProgramData/chocolatey/lib/llvm/tools/chocolateyinstall.ps1 2>/dev/null || true
          echo "A: uninstall"
          timeout 30 "/c/Program Files/LLVM/Uninstall.exe" /S; echo "uninstall_exit=$?"
          echo "B: registry"
          reg query "HKLM\SOFTWARE\LLVM" /s 2>&1 | head -15 || true
          reg query "HKLM\SOFTWARE\WOW6432Node\LLVM" /s 2>&1 | head -15 || true
          echo "C: llvm dirs on C:"
          timeout 90 find /c -maxdepth 3 -type d -iname "*llvm*" 2>/dev/null | head -20
          echo "D: wipe"
          reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\LLVM" /f 2>&1 || true
          reg delete "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\LLVM" /f 2>&1 || true
          timeout 300 rm -rf "/c/Program Files/LLVM" && echo "dir wiped" || echo "wipe failed"
          echo "E: choco fresh install"
          timeout 300 choco install llvm -y --no-progress --force
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          echo "bin entries after: $(ls "/c/Program Files/LLVM/bin" 2>/dev/null | wc -l)"
          llvm_diag
        fi
        assert_llvm || { echo "LLVM still unusable"; exit 1; }
        echo "llvm-config: $(command -v llvm-config)"
        llvm-config --version
        cmakedir="$(llvm-config --cmakedir)"
        echo "cmakedir: $cmakedir"
        # llvm-config prints native Windows paths; test(1) needs the MSYS form
        test -f "$(cygpath -u "$cmakedir")/LLVMConfig.cmake"
        echo "LLVM_DIR=$cmakedir" >> $GITHUB_ENV
        # llvm-config must stay on PATH for the configure step (faust's build
        # uses it); GITHUB_PATH needs the Windows form so native cmake sees it
        echo "$(cygpath -m "$(dirname "$(command -v llvm-config)")")" >> "$GITHUB_PATH"
        # evidence: what faust appends to the link line, and where xml2 lives
        llvm-config --system-libs || true
        ls "$(cygpath -u "$cmakedir")/../../lib/"xml2* 2>/dev/null || echo "no xml2* in LLVM lib dir"

    - name: make
      run: |
        set -e
        echo version: $version
        echo "llvmdir: $LLVM_DIR"
        mkdir build && cd build
        cmake .. -A x64 -DLLVM_DIR="$LLVM_DIR" -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF
        cmake --build . --config Release --target faustgen_tilde_project
        cmake --install . --prefix dist --config Release
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp
        # evidence: LLVM is linked statically, so no LLVM/third-party DLLs
        # need to ship alongside the external (same as GRAME's faustgen)
        objdump -p "dist/faustgen2~/faustgen2~.dll" | grep "DLL Name" || true

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-windows-x86_64
        path: build/dist
        retention-days: 7

  tarball:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: make dist
      run: |
        ./make-dist.sh

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-source
        path: pd-faustgen2-*.tar.gz
        retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [macos-build, windows-build, ubuntu-build, tarball]
    steps:
    - uses: actions/download-artifact@v4
    - name: ziptie
      run: |
        mkdir dist
        for x in pd-faustgen2-*; do (cd $x && zip -r ../dist/$x.zip *); done
    - name: release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        draft: true
        files: dist/*.zip
