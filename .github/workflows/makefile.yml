name: github ci
on:
  push:
    branches: [ faustgen2, testing ]
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Run only the windows-build job (skip macos/ubuntu/tarball)'
        type: boolean
        default: false

jobs:
  macos-build:
    if: ${{ !inputs.windows_only }}

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: dependencies
      run: |
        brew install llvm

    - name: make
      run: |
        echo version: $version
        export PATH="$(brew --prefix)/opt/llvm/bin:$PATH"
        # Apple clang doesn't search Homebrew's lib dirs for -l flags; LLVM's
        # system libs (zstd etc.) live there.
        export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix)/opt/zstd/lib:$(brew --prefix)/opt/ncurses/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
        LLVM_DIR="$(brew --prefix)/opt/llvm/lib/cmake/llvm"
        mkdir build && cd build
        cmake .. -DLLVM_DIR="$LLVM_DIR" -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF
        cmake --build . --config Release --target faustgen_tilde_project
        # staged install into dist
        cmake --install . --prefix dist
        # copy over the Homebrew LLVM dylibs and fix the loader paths of the
        # external so that it doesn't depend on Homebrew at runtime
        cd dist/faustgen2~
        for x in $(otool -L faustgen2~.pd_darwin | sed 's/^ *//' | awk 'NR>1 {print $1}'); do
          case "$x" in
            /usr/*|/System/*|@*|*faustgen2~.pd_darwin) continue ;;
          esac
          echo "bundling: $x"
          cp -f "$x" .
          install_name_tool -change "$x" "@loader_path/$(basename "$x")" faustgen2~.pd_darwin
        done
        # the bundled dylibs themselves reference absolute Homebrew paths
        # (libLLVM -> zstd etc.); rewrite those too so the bundle is relocatable
        for d in *.dylib; do
          for x in $(otool -L "$d" | sed 's/^ *//' | awk 'NR>1 {print $1}'); do
            case "$x" in
              /usr/*|/System/*|@*) continue ;;
            esac
            b="$(basename "$x")"
            [ "$b" = "$d" ] && continue
            echo "bundling (via $d): $x"
            [ -f "$b" ] || cp -f "$x" .
            install_name_tool -change "$x" "@loader_path/$b" "$d"
          done
        done
        # install_name_tool invalidates the arm64 code signature
        codesign -f -s - *.dylib faustgen2~.pd_darwin
        echo "=== lipo -archs ==="
        lipo -archs faustgen2~.pd_darwin
        echo "=== otool -L faustgen2~.pd_darwin ==="
        otool -L faustgen2~.pd_darwin
        cd ../..
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-macos-arm64
        path: build/dist
        retention-days: 7

  ubuntu-build:
    if: ${{ !inputs.windows_only }}

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libedit-dev zlib1g-dev libzstd-dev
        sudo apt-get install -y llvm-dev libpolly-18-dev || sudo apt-get install -y llvm-18-dev libpolly-18-dev

    - name: locate llvm
      run: |
        set -e
        LC="$(command -v llvm-config || true)"
        if [ -z "$LC" ]; then
          LC="$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1 || true)"
        fi
        if [ -z "$LC" ]; then
          echo "llvm-config not found" >&2; exit 1
        fi
        # faust's build looks for an unversioned llvm-config on PATH
        case "$LC" in
          */llvm-config) ;;
          *) sudo ln -sf "$LC" /usr/local/bin/llvm-config ;;
        esac
        echo "LLVM_DIR=$($LC --cmakedir)" >> $GITHUB_ENV

    - name: make
      run: |
        echo version: $version
        mkdir build && cd build
        cmake .. -DLLVM_DIR="$LLVM_DIR" -DCMAKE_BUILD_TYPE=Release -DINSTALL_DIR=faustgen2~ -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF
        cmake --build . --config Release --target faustgen_tilde_project
        # staged install into dist
        cmake --install . --prefix dist
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-ubuntu-x86_64
        path: build/dist
        retention-days: 7

  windows-build:

    runs-on: windows-2025
    # We use bash for the entire build since powershell just drives me insane.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    # LLVM: the runner image's own install is defective (no llvm-config.exe,
    # no LLVMConfig.cmake; upstream actions/runner-images#14260), and neither
    # choco nor winget produces a complete tree. Provision instead the pinned
    # archive that grame-cncm/faust's own Windows CI uses (libfaust.yml),
    # checksum-verified, per spec build-system "Uses platform-provided LLVM".

    - name: prepare
      run: |
        set -e
        curl -sSL --retry 3 -o llvm.zip https://github.com/grame-cncm/faust/releases/download/2.59.5-llvm/llvm-17.0.6-win11-x86_64.zip
        echo "ed3a79afecb971ac530a6041f088fa1f0db9c5e0a7f14e9d472a4344e3b0ca75  llvm.zip" | sha256sum -c -
        command -v 7z >/dev/null || export PATH="/c/Program Files/7-Zip:$PATH"
        7z x llvm.zip -y >/dev/null
        rm llvm.zip
        # LLVMExports.cmake hard-errors if any file it imports is absent; the
        # archive prunes build-time tools (llvm-tblgen, ...). CMake only checks
        # existence and our build never runs them, so create the missing ones.
        grep -hoE '"\$\{_IMPORT_PREFIX\}[^"]*"' llvm/lib/cmake/llvm/LLVMExports*.cmake \
          | tr -d '"' | sed "s|\${_IMPORT_PREFIX}|$PWD/llvm|" | sort -u \
          | while IFS= read -r f; do
              if [ ! -e "$f" ]; then
                mkdir -p "$(dirname "$f")"
                touch "$f"
                echo "stubbed missing import: ${f#$PWD/llvm/}"
              fi
            done
        export PATH="$PWD/llvm/bin:$PATH"
        # native exes print CRLF through pipes; strip CR for test(1)/GITHUB_ENV
        echo "llvm-config : $(llvm-config --version | tr -d '\r')"
        cmakedir="$(llvm-config --cmakedir | tr -d '\r')"
        test -f "$(cygpath -u "$cmakedir")/LLVMConfig.cmake"
        echo "LLVM_DIR=$cmakedir" >> $GITHUB_ENV
        # native cmake needs llvm-config's dir as a Windows path on PATH
        echo "$(cygpath -m "$PWD/llvm/bin")" >> "$GITHUB_PATH"
        # evidence: what faust appends to the link line, and where xml2 lives
        llvm-config --system-libs | tr -d '\r' || true
        ls "$(cygpath -u "$cmakedir")/../../lib/"xml2* 2>/dev/null || echo "no xml2* in LLVM lib dir"

    - name: pd-import-library
      run: |
        set -e
        # pd.build's vendored pd.lib predates pdgui_vmess; derive an import
        # library from the official binary matching the pure-data submodule
        # pin (0.57-0) instead. Keep the URL/sha and the submodule in sync.
        curl -sSL --retry 3 -o pd.zip https://msp.ucsd.edu/Software/pd-0.57-0.msw.zip
        echo "1c128583e9bb78c42c88af72e02951d3808af6598a0a68abf0eda61e8d2bc4a3  pd.zip" | sha256sum -c -
        unzip -o -q pd.zip 'pd-0.57-0/bin/pd.dll'
        rm pd.zip
        # export-name list straight from the PE export directory (stdlib only)
        python - <<'PY'
        import struct
        data = open('pd-0.57-0/bin/pd.dll', 'rb').read()
        e_lfanew = struct.unpack_from('<I', data, 0x3c)[0]
        coff = e_lfanew + 4
        nsec, = struct.unpack_from('<H', data, coff + 2)
        optsz, = struct.unpack_from('<H', data, coff + 16)
        opt = coff + 20
        magic, = struct.unpack_from('<H', data, opt)
        assert magic == 0x20b, hex(magic)
        exp_rva, = struct.unpack_from('<I', data, opt + 112)
        so = opt + optsz
        secs = [struct.unpack_from('<IIII', data, so + i * 40 + 8) for i in range(nsec)]
        def rva2off(rva):
            for vsz, va, rsz, raw in secs:
                if va <= rva < va + max(vsz, rsz):
                    return raw + (rva - va)
            raise ValueError(hex(rva))
        eo = rva2off(exp_rva)
        nnames, = struct.unpack_from('<I', data, eo + 24)
        names_off = rva2off(struct.unpack_from('<I', data, eo + 32)[0])
        names = []
        for i in range(nnames):
            nrva, = struct.unpack_from('<I', data, names_off + 4 * i)
            noff = rva2off(nrva)
            names.append(data[noff:data.index(b'\0', noff)].decode())
        assert 'pdgui_vmess' in names and len(names) > 2000
        open('pd.def', 'w').write('EXPORTS\n' + '\n'.join(names) + '\n')
        print('pd.def:', len(names), 'exports')
        PY
        # lib.exe next to the toolchain VS ships; not on PATH, so locate it
        vsinst=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
        test -n "$vsinst"
        libexe=$(ls "$(cygpath -u "$vsinst")"/VC/Tools/MSVC/*/Hostx64/x64/lib.exe | sort -V | tail -1)
        test -f "$libexe"
        mkdir -p pdlibs
        # MSYS2_ARG_CONV_EXCL stops bash from rewriting /def etc. as paths
        MSYS2_ARG_CONV_EXCL='*' "$libexe" /def:pd.def /machine:x64 /out:pdlibs/pd.lib
        test -f pdlibs/pd.lib
        echo "PD_LIBRARY=$(cygpath -m "$PWD/pdlibs/pd.lib")" >> "$GITHUB_ENV"

    - name: make
      run: |
        set -e
        echo version: $version
        echo "llvmdir: $LLVM_DIR"
        mkdir build && cd build
        cmake .. -A x64 -DLLVM_DIR="$LLVM_DIR" -DINCLUDE_LLVM_STATIC_IN_ARCHIVE=OFF -DPD_LIBRARY="$PD_LIBRARY"
        cmake --build . --config Release --target faustgen_tilde_project
        cmake --install . --prefix dist --config Release
        cp ../README.md ../LICENSE dist/faustgen2~/
        chmod 0444 dist/faustgen2~/default.dsp
        # evidence: LLVM is linked statically, so no LLVM/third-party DLLs
        # need to ship alongside the external (same as GRAME's faustgen)
        objdump -p "dist/faustgen2~/faustgen2~.dll" | grep "DLL Name" || true

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-windows-x86_64
        path: build/dist
        retention-days: 7

  tarball:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        echo "version=$(git describe --tags)" >> $GITHUB_ENV

    - name: make dist
      run: |
        ./make-dist.sh

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: pd-faustgen2-${{ env.version }}-source
        path: pd-faustgen2-*.tar.gz
        retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [macos-build, windows-build, ubuntu-build, tarball]
    steps:
    - uses: actions/download-artifact@v4
    - name: ziptie
      run: |
        mkdir dist
        for x in pd-faustgen2-*; do (cd $x && zip -r ../dist/$x.zip *); done
    - name: release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        draft: true
        files: dist/*.zip
